<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استوديو الإبداع AI | لصناعة الصور الفريدة</title>
    <!-- Tailwind CSS للتحكم بالتصميم والتجاوب -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eef2ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- رأس الصفحة -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-wand-magic-sparkles text-white"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">استوديو الإبداع AI</h1>
                    <p class="text-xs text-slate-400">ابتكر صوراً فريدة بالذكاء الاصطناعي</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse ml-1.5"></span> متصل وجاهز
                </span>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- لوحة التحكم (اليسار/اليمين) -->
        <section class="lg:col-span-5 bg-slate-900/60 border border-slate-800 rounded-2xl p-5 flex flex-col gap-5 h-fit shadow-xl">
            <h2 class="font-bold text-base flex items-center gap-2 text-indigo-400">
                <i class="fa-solid fa-sliders"></i> إعدادات التوليد
            </h2>

            <!-- صندوق الوصف -->
            <div class="flex flex-col gap-2">
                <label class="text-sm font-medium text-slate-300">صف الصورة التي تتخيلها بدقة:</label>
                <textarea id="promptInput" rows="4" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500 transition resize-none" placeholder="مثال: قط لطيف يرتدي لباس رائد فضاء في الفضاء الخارجي، إضاءة سينمائية، تفاصيل دقيقة..."></textarea>
            </div>

            <!-- الأساليب الفنية -->
            <div class="flex flex-col gap-2">
                <label class="text-sm font-medium text-slate-300">الأسلوب الفني:</label>
                <div class="grid grid-cols-3 gap-2" id="styleSelector">
                    <button type="button" onclick="selectStyle(this, 'Cinematic, hyper-realistic')" class="style-btn bg-slate-800/80 border border-indigo-500 text-indigo-300 text-xs py-2 px-3 rounded-lg font-medium transition hover:bg-slate-800">سينمائي واقعي</button>
                    <button type="button" onclick="selectStyle(this, '3D Pixar style character')" class="style-btn bg-slate-950 border border-slate-800 text-slate-400 text-xs py-2 px-3 rounded-lg font-medium transition hover:bg-slate-800">بيكسار 3D</button>
                    <button type="button" onclick="selectStyle(this, 'Anime masterpiece')" class="style-btn bg-slate-950 border border-slate-800 text-slate-400 text-xs py-2 px-3 rounded-lg font-medium transition hover:bg-slate-800">أنمي ياباني</button>
                    <button type="button" onclick="selectStyle(this, 'Digital art fantasy')" class="style-btn bg-slate-950 border border-slate-800 text-slate-400 text-xs py-2 px-3 rounded-lg font-medium transition hover:bg-slate-800">فن خيالي</button>
                    <button type="button" onclick="selectStyle(this, 'Cyberpunk neon style')" class="style-btn bg-slate-950 border border-slate-800 text-slate-400 text-xs py-2 px-3 rounded-lg font-medium transition hover:bg-slate-800">سايبربانك</button>
                    <button type="button" onclick="selectStyle(this, 'Oil painting classic')" class="style-btn bg-slate-950 border border-slate-800 text-slate-400 text-xs py-2 px-3 rounded-lg font-medium transition hover:bg-slate-800">رسم زيتي</button>
                </div>
            </div>

            <!-- أبعاد الصورة -->
            <div class="flex flex-col gap-2">
                <label class="text-sm font-medium text-slate-300">مقاس الصورة:</label>
                <div class="grid grid-cols-3 gap-2" id="aspectSelector">
                    <button type="button" onclick="selectAspect(this, '1024/1024')" class="aspect-btn bg-indigo-600/20 border border-indigo-500 text-indigo-300 text-xs py-2 rounded-lg font-medium transition">مربع (1:1)</button>
                    <button type="button" onclick="selectAspect(this, '768/1024')" class="aspect-btn bg-slate-950 border border-slate-800 text-slate-400 text-xs py-2 rounded-lg font-medium transition">عمودي (9:16)</button>
                    <button type="button" onclick="selectAspect(this, '1024/768')" class="aspect-btn bg-slate-950 border border-slate-800 text-slate-400 text-xs py-2 rounded-lg font-medium transition">أفقي (16:9)</button>
                </div>
            </div>

            <!-- زر التوليد -->
            <button onclick="generateImage()" id="generateBtn" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-indigo-600/25 transition flex items-center justify-center gap-2 mt-2">
                <i class="fa-solid fa-wand-magic-sparkles"></i> توليد الصورة السحرية
            </button>
        </section>

        <!-- منطقة عرض الصورة -->
        <section class="lg:col-span-7 flex flex-col gap-4">
            <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-5 flex-1 flex flex-col items-center justify-center min-h-[400px] relative overflow-hidden shadow-xl">
                
                <!-- حالة الانتظار أو البداية -->
                <div id="placeholderState" class="text-center flex flex-col items-center gap-3 p-6">
                    <div class="w-20 h-20 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-600 text-3xl">
                        <i class="fa-regular fa-image"></i>
                    </div>
                    <h3 class="font-bold text-slate-300">لم تقم بتوليد أي صورة بعد</h3>
                    <p class="text-sm text-slate-500 max-w-sm">اكتب وصفاً في الخانة المخصصة واضغط على زر التوليد لتشاهد إبداعك يتجسد أمامك.</p>
                </div>

                <!-- حالة التحميل -->
                <div id="loadingState" class="hidden text-center flex flex-col items-center gap-4">
                    <div class="relative w-16 h-16">
                        <div class="absolute inset-0 rounded-full border-4 border-indigo-500/20"></div>
                        <div class="absolute inset-0 rounded-full border-4 border-indigo-600 border-t-transparent animate-spin"></div>
                    </div>
                    <p class="text-sm font-medium text-indigo-400 animate-pulse">جاري رسم وتصميم صورتك الفريدة...</p>
                </div>

                <!-- عرض الصورة الناتجة -->
                <div id="resultState" class="hidden w-full h-full flex flex-col items-center gap-4">
                    <div class="relative group rounded-xl overflow-hidden border border-slate-800 max-w-full">
                        <img id="generatedImage" src="" alt="Generated AI Image" class="max-h-[450px] w-auto object-contain rounded-xl">
                    </div>
                    <div class="flex items-center gap-3">
                        <a id="downloadBtn" href="#" download="ai-image.jpg" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-2.5 px-5 rounded-xl transition flex items-center gap-2 shadow-lg shadow-emerald-600/20">
                            <i class="fa-solid fa-download"></i> تحميل الصورة بجودة
